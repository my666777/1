<！DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANIME WORLD · 动漫推荐站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #08080f;
    --card: #14142a;
    --accent: #ff3d81;
    --accent2: #7c5cff;
    --text: #ececf5;
    --muted: #8b8ba7;
    --border: rgba(255,255,255,.08);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 背景光晕 */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(700px 460px at 12% 0%, rgba(124,92,255,.20), transparent 70%),
      radial-gradient(760px 520px at 88% 8%, rgba(255,61,129,.16), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ===== 导航 ===== */
  .nav {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 6vw;
    background: rgba(8,8,15,.62);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .logo { font-weight: 800; font-size: 1.05rem; letter-spacing: 1.5px; color: #fff; text-decoration: none; }
  .logo span {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .links { display: flex; gap: 26px; }
  .links a { color: var(--muted); text-decoration: none; font-size: .9rem; transition: color .25s; }
  .links a:hover { color: #fff; }

  /* ===== Hero ===== */
  .hero {
    position: relative; z-index: 1;
    max-width: 1200px; margin: 0 auto;
    padding: 86px 6vw 74px;
  }
  .eyebrow {
    color: var(--accent); font-size: .82rem; letter-spacing: 2.5px;
    font-weight: 700; margin-bottom: 18px;
  }
  .hero h1 {
    font-size: clamp(2.1rem, 6vw, 4rem);
    line-height: 1.15; letter-spacing: -1px;
    font-weight: 800; margin-bottom: 20px;
  }
  .grad {
    background: linear-gradient(120deg, var(--accent), var(--accent2) 55%, #4facfe);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub {
    color: var(--muted); font-size: 1.02rem; line-height: 1.85;
    max-width: 520px; margin-bottom: 32px;
  }
  .hero-actions { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 54px; }

  .btn {
    display: inline-block; padding: 13px 28px; border-radius: 999px;
    font-size: .95rem; font-weight: 600; cursor: pointer;
    border: none; text-decoration: none; font-family: inherit;
    transition: transform .25s, box-shadow .25s, background .25s;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; box-shadow: 0 10px 30px -10px rgba(255,61,129,.85);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 16px 36px -10px rgba(255,61,129,1); }
  .btn-ghost {
    background: rgba(255,255,255,.06); color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: rgba(255,255,255,.12); transform: translateY(-2px); }
  .btn.done { background: #2fbf71; box-shadow: none; cursor: default; }

  .stats { display: flex; gap: 44px; flex-wrap: wrap; }
  .stats div { display: flex; flex-direction: column; }
  .stats strong {
    font-size: 1.6rem; font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .stats span { font-size: .78rem; color: var(--muted); margin-top: 2px; }

  /* ===== 主内容 ===== */
  main {
    position: relative; z-index: 1;
    max-width: 1200px; margin: 0 auto;
    padding: 0 6vw 100px;
  }
  #list { scroll-margin-top: 80px; }

  .controls {
    display: flex; flex-wrap: wrap; gap: 16px;
    justify-content: space-between; align-items: center;
    margin-bottom: 28px;
  }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tab {
    padding: 8px 16px; border-radius: 999px; font-size: .86rem;
    border: 1px solid var(--border); background: transparent;
    color: var(--muted); cursor: pointer; font-family: inherit;
    transition: all .25s;
  }
  .tab:hover { color: #fff; border-color: rgba(255,255,255,.28); }
  .tab.active {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; border-color: transparent;
    box-shadow: 0 6px 20px -6px rgba(255,61,129,.7);
  }
  .search {
    padding: 10px 18px; border-radius: 999px; width: 220px;
    border: 1px solid var(--border); background: rgba(255,255,255,.04);
    color: var(--text); outline: none; font-family: inherit; font-size: .9rem;
    transition: all .25s;
  }
  .search::placeholder { color: #5e5e78; }
  .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,61,129,.15); }

  /* ===== 卡片网格 ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 22px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    opacity: 0;
    transform: translateY(24px);
    transition:
      opacity .55s ease,
      transform .55s cubic-bezier(.2,.8,.3,1),
      border-color .3s,
      box-shadow .35s;
  }
  .card.show { opacity: 1; transform: translateY(0); }
  .card:hover {
    transform: translateY(-8px) scale(1.02);
    border-color: rgba(255,61,129,.55);
    box-shadow: 0 22px 44px -14px rgba(255,61,129,.45);
  }

  .cover {
    position: relative;
    aspect-ratio: 4 / 5;
    display: grid; place-items: center;
    background: linear-gradient(145deg, var(--c1), var(--c2));
    overflow: hidden;
  }
  .cover::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 30% 20%, rgba(255,255,255,.3), transparent 58%);
  }
  .emoji {
    position: relative; z-index: 1;
    font-size: clamp(2.4rem, 7vw, 3.4rem);
    filter: drop-shadow(0 8px 14px rgba(0,0,0,.4));
  }
  .score {
    position: absolute; top: 10px; right: 10px; z-index: 2;
    font-size: .74rem; font-weight: 700; color: #ffd166;
    padding: 4px 9px; border-radius: 999px;
    background: rgba(0,0,0,.45);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .info { padding: 14px 16px 16px; }
  .info h3 { font-size: 1rem; margin-bottom: 6px; font-weight: 700; }
  .meta { font-size: .76rem; color: var(--muted); }

  .empty {
    grid-column: 1 / -1; text-align: center;
    padding: 70px 20px; color: var(--muted);
    font-size: 1.05rem; line-height: 2;
  }
  .empty span { font-size: .84rem; opacity: .65; }

  .modal {
