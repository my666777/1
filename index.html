<！DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANIME WORLD · 动漫推荐站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #08080f;
    --card: #14142a;
    --accent: #ff3d81;
    --accent2: #7c5cff;
    --text: #ececf5;
    --muted: #8b8ba7;
    --border: rgba(255,255,255,.08);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 背景光晕 */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(700px 460px at 12% 0%, rgba(124,92,255,.20), transparent 70%),
      radial-gradient(760px 520px at 88% 8%, rgba(255,61,129,.16), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ===== 导航 ===== */
  .nav {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 6vw;
    background: rgba(8,8,15,.62);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .logo { font-weight: 800; font-size: 1.05rem; letter-spacing: 1.5px; color: #fff; text-decoration: none; }
  .logo span {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .links { display: flex; gap: 26px; }
  .links a { color: var(--muted); text-decoration: none; font-size: .9rem; transition: color .25s; }
  .links a:hover { color: #fff; }

  /* ===== Hero ===== */
  .hero {
    position: relative; z-index: 1;
    max-width: 1200px; margin: 0 auto;
    padding: 86px 6vw 74px;
  }
  .eyebrow {
    color: var(--accent); font-size: .82rem; letter-spacing: 2.5px;
    font-weight: 700; margin-bottom: 18px;
  }
  .hero h1 {
    font-size: clamp(2.1rem, 6vw, 4rem);
    line-height: 1.15; letter-spacing: -1px;
    font-weight: 800; margin-bottom: 20px;
  }
  .grad {
    background: linear-gradient(120deg, var(--accent), var(--accent2) 55%, #4facfe);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub {
    color: var(--muted); font-size: 1.02rem; line-height: 1.85;
    max-width: 520px; margin-bottom: 32px;
  }
  .hero-actions { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 54px; }

  .btn {
    display: inline-block; padding: 13px 28px; border-radius: 999px;
    font-size: .95rem; font-weight: 600; cursor: pointer;
    border: none; text-decoration: none; font-family: inherit;
    transition: transform .25s, box-shadow .25s, background .25s;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; box-shadow: 0 10px 30px -10px rgba(255,61,129,.85);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 16px 36px -10px rgba(255,61,129,1); }
  .btn-ghost {
    background: rgba(255,255,255,.06); color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: rgba(255,255,255,.12); transform: translateY(-2px); }
  .btn.done { background: #2fbf71; box-shadow: none; cursor: default; }

  .stats { display: flex; gap: 44px; flex-wrap: wrap; }
  .stats div { display: flex; flex-direction: column; }
  .stats strong {
    font-size: 1.6rem; font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .stats span { font-size: .78rem; color: var(--muted); margin-top: 2px; }

  /* ===== 主内容 ===== */
  main {
    position: relative; z-index: 1;
    max-width: 1200px; margin: 0 auto;
    padding: 0 6vw 100px;
  }
  #list { scroll-margin-top: 80px; }

  .controls {
    display: flex; flex-wrap: wrap; gap: 16px;
    justify-content: space-between; align-items: center;
    margin-bottom: 28px;
  }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tab {
    padding: 8px 16px; border-radius: 999px; font-size: .86rem;
    border: 1px solid var(--border); background: transparent;
    color: var(--muted); cursor: pointer; font-family: inherit;
    transition: all .25s;
  }
  .tab:hover { color: #fff; border-color: rgba(255,255,255,.28); }
  .tab.active {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; border-color: transparent;
    box-shadow: 0 6px 20px -6px rgba(255,61,129,.7);
  }
  .search {
    padding: 10px 18px; border-radius: 999px; width: 220px;
    border: 1px solid var(--border); background: rgba(255,255,255,.04);
    color: var(--text); outline: none; font-family: inherit; font-size: .9rem;
    transition: all .25s;
  }
  .search::placeholder { color: #5e5e78; }
  .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,61,129,.15); }

  /* ===== 卡片网格 ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 22px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    opacity: 0;
    transform: translateY(24px);
    transition:
      opacity .55s ease,
      transform .55s cubic-bezier(.2,.8,.3,1),
      border-color .3s,
      box-shadow .35s;
  }
  .card.show { opacity: 1; transform: translateY(0); }
  .card:hover {
    transform: translateY(-8px) scale(1.02);
    border-color: rgba(255,61,129,.55);
    box-shadow: 0 22px 44px -14px rgba(255,61,129,.45);
  }

  .cover {
    position: relative;
    aspect-ratio: 4 / 5;
    display: grid; place-items: center;
    background: linear-gradient(145deg, var(--c1), var(--c2));
    overflow: hidden;
  }
  .cover::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 30% 20%, rgba(255,255,255,.3), transparent 58%);
  }
  .emoji {
    position: relative; z-index: 1;
    font-size: clamp(2.4rem, 7vw, 3.4rem);
    filter: drop-shadow(0 8px 14px rgba(0,0,0,.4));
  }
  .score {
    position: absolute; top: 10px; right: 10px; z-index: 2;
    font-size: .74rem; font-weight: 700; color: #ffd166;
    padding: 4px 9px; border-radius: 999px;
    background: rgba(0,0,0,.45);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .info { padding: 14px 16px 16px; }
  .info h3 { font-size: 1rem; margin-bottom: 6px; font-weight: 700; }
  .meta { font-size: .76rem; color: var(--muted); }

  .empty {
    grid-column: 1 / -1; text-align: center;
    padding: 70px 20px; color: var(--muted);
    font-size: 1.05rem; line-height: 2;
  }
  .empty span { font-size: .84rem; opacity: .65; }

  /* ===== 弹窗 ===== */
  .modal {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  background: rgba(4,4,10,.76);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  opacity: 0; visibility: hidden;
  transition: opacity .3s, visibility .3s;
}
.modal.open { opacity: 1; visibility: visible; }

.modal-card {
  position: relative;
  width: min(560px, 100%);
  max-height: 88vh; overflow-y: auto;
  padding: 26px;
  border-radius: 22px;
  background: linear-gradient(160deg, #1b1b34, #12121f);
  border: 1px solid rgba(255,255,255,.1);
  transform: translateY(20px) scale(.96);
  transition: transform .35s cubic-bezier(.2,.8,.3,1);
}
.modal.open .modal-card { transform: none; }

.m-hero {
  position: relative; overflow: hidden;
  height: 150px; border-radius: 16px;
  display: grid; place-items: center;
  font-size: 3.6rem; margin-bottom: 18px;
}
.m-hero::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 30% 20%, rgba(255,255,255,.32), transparent 60%);
}
.modal-card h2 { font-size: 1.45rem; margin-bottom: 6px; }
.m-meta { color: var(--muted); font-size: .84rem; margin-bottom: 14px; }
.m-stars { color: #ffd166; letter-spacing: 3px; font-size: .95rem; margin-bottom: 16px; }
.m-stars span { color: var(--text); font-weight: 700; letter-spacing: 0; margin-left: 8px; }
.m-desc { color: #c3c3d8; font-size: .92rem; line-height: 1.9; margin-bottom: 22px; }
.m-btn { width: 100%; }

.close {
  position: absolute; top: 14px; right: 14px; z-index: 3;
  width: 34px; height: 34px; border-radius: 50%;
  border: none; cursor: pointer; font-size: .85rem;
  background: rgba(255,255,255,.08); color: var(--text);
  transition: background .25s;
}
.close:hover { background: rgba(255,61,129,.85); }

/* ===== 页脚 ===== */
footer {
  position: relative; z-index: 1;
  text-align: center;
  padding: 38px 6vw 60px;
  border-top: 1px solid var(--border);
  color: var(--muted); font-size: .8rem; line-height: 2;
}

@media (max-width: 640px) {
  .links { display: none; }
  .controls { flex-direction: column; align-items: stretch; }
  .search { width: 100%; }
  .stats { gap: 28px; }
  .hero { padding: 60px 6vw 54px; }
}
</style>
</head>
<body>

<header class="nav">
  <a class="logo" href="#top">ANIME<span>WORLD</span></a>
  <nav class="links">
    <a href="#list">番剧列表</a>
    <a href="#list">分类筛选</a>
    <a href="#" id="randomTop">随机一部</a>
  </nav>
</header>

<section class="hero" id="top">
  <p class="eyebrow">✦ 2026 追番指南</p>
  <h1>找到属于你的<br><span class="grad">下一部神作</span></h1>
  <p class="sub">精选高分动漫推荐，按心情挑一部。热血、治愈、科幻、悬疑——今晚不愁没番看。</p>
  <div class="hero-actions">
    <a class="btn btn-primary" href="#list">开始探索</a>
    <button class="btn btn-ghost" id="randomBtn">🎲 随机一部</button>
  </div>
  <div class="stats">
    <div><strong>12</strong><span>部精选</span></div>
    <div><strong>8</strong><span>种分类</span></div>
    <div><strong>9.3</strong><span>平均评分</span></div>
  </div>
</section>

<main id="list">
  <div class="controls">
    <div class="tabs" id="tabs"></div>
    <input class="search" id="search" type="search" placeholder="搜索番剧…">
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  ANIME WORLD · 个人练习作品<br>
  <span style="opacity:.6">纯前端实现 · 单文件可运行 · 数据为示例内容</span>
</footer>

<div class="modal" id="modal">
  <div class="modal-card" id="modalCard"></div>
</div>

<script>
/* ============ 数据 ============ */
const animeList = [
  { id:1,  title:'咒术回战',       emoji:'🔥', year:2020, rating:9.2, tags:['热血','奇幻'], colors:['#ff416c','#ff4b2b'],
    desc:'虎杖悠仁吞下特级咒物「两面宿傩的手指」，从此被卷入咒术师与咒灵的战斗。高密度打斗加上独特的世界观，是近年热血番的天花板之一。' },
  { id:2,  title:'间谍过家家',     emoji:'🕵️', year:2022, rating:9.0, tags:['搞笑','治愈'], colors:['#43e97b','#38f9d7'],
    desc:'间谍、杀手与超能力少女组成一个「假家庭」，各自隐瞒身份，却慢慢真的成了家人。笑点密集，又意外温暖。' },
  { id:3,  title:'鬼灭之刃',       emoji:'⚔️', year:2019, rating:9.1, tags:['热血','奇幻'], colors:['#1e3c72','#2a5298'],
    desc:'少年炭治郎为救变成鬼的妹妹而加入鬼杀队。ufotable 的神级作画，让每一场战斗都像电影。' },
  { id:4,  title:'你的名字。',     emoji:'🌠', year:2016, rating:9.3, tags:['恋爱','奇幻'], colors:['#4facfe','#00f2fe'],
    desc:'互换身体的少年少女，跨越时间与灾难寻找彼此。新海诚把「错过」拍成了宇宙级的浪漫。' },
  { id:5,  title:'进击的巨人',     emoji:'🏰', year:2013, rating:9.5, tags:['热血','悬疑'], colors:['#8e2de2','#4a00e0'],
    desc:'墙内人类与巨人的战争，层层反转揭开世界的真相。一部关于自由与代价的史诗。' },
  { id:6,  title:'紫罗兰永恒花园', emoji:'💌', year:2018, rating:9.2, tags:['治愈','恋爱'], colors:['#f093fb','#f5576c'],
    desc:'战争结束后，少女为了理解「爱」而成为代笔人。京都动画的极致美学，每一帧都是画。' },
  { id:7,  title:'命运石之门',     emoji:'⏳', year:2011, rating:9.6, tags:['科幻','悬疑'], colors:['#0f2027','#2c5364'],
    desc:'中二科学家发明了能向过去发送短信的装置，随之而来的是无法挽回的代价。前期慢热，后期封神。' },
  { id:8,  title:'夏目友人帐',     emoji:'🍃', year:2008, rating:9.1, tags:['治愈','奇幻'], colors:['#a8e063','#56ab2f'],
    desc:'能看见妖怪的少年，与妖怪们相遇、告别。温柔到骨子里的治愈系经典。' },
  { id:9,  title:'电锯人',         emoji:'🪚', year:2022, rating:8.8, tags:['热血','悬疑'], colors:['#c31432','#240b36'],
    desc:'少年与电锯恶魔合体，成为公安恶魔猎人。荒诞、暴力，又莫名浪漫，MAPPA 的疯狂之作。' },
  { id:10, title:'星际牛仔',       emoji:'🚀', year:1998, rating:9.3, tags:['科幻','热血'], colors:['#fc4a1a','#f7b733'],
    desc:'赏金猎人史派克在星际间游荡，爵士乐、孤独与过去。二十多年过去，它依然是风格标杆。' },
  { id:11, title:'排球少年!!',     emoji:'🏐', year:2014, rating:9.2, tags:['热血','搞笑'], colors:['#f7971e','#ffd200'],
    desc:'身高不够的日向翔阳遇上天才二传影山飞雄，一起把弱小球队带向全国。燃到起鸡皮疙瘩的运动番。' },
  { id:12, title:'葬送的芙莉莲',   emoji:'🧝', year:2023, rating:9.4, tags:['治愈','奇幻'], colors:['#667eea','#764ba2'],
    desc:'长寿精灵在勇者死后重走旅途，学着理解人类短暂的一生。安静、克制，后劲极大。' }
];

const TAGS = ['全部','热血','治愈','科幻','悬疑','恋爱','搞笑','奇幻'];

/* ============ 元素引用 ============ */
const gridEl = document.getElementById('grid');
const tabsEl = document.getElementById('tabs');
const searchEl = document.getElementById('search');
const modal = document.getElementById('modal');
const modalCard = document.getElementById('modalCard');

let activeTag = '全部';
let keyword = '';

/* ============ 滚动进入动画 ============ */
const io = new IntersectionObserver((entries) => {
  entries.forEach(en => {
    if (en.isIntersecting) {
      en.target.classList.add('show');
      io.unobserve(en.target);
    }
  });
}, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

/* ============ 渲染分类标签 ============ */
TAGS.forEach((t, i) => {
  const btn = document.createElement('button');
  btn.className = 'tab' + (i === 0 ? ' active' : '');
  btn.textContent = t;
  btn.dataset.tag = t;
  btn.addEventListener('click', () => {
    activeTag = t;
    document.querySelectorAll('.tab').forEach(x =>
      x.classList.toggle('active', x.dataset.tag === t)
    );
    render();
  });
  tabsEl.appendChild(btn);
});

/* ============ 渲染卡片 ============ */
function render() {
  const kw = keyword.trim().toLowerCase();

  const list = animeList.filter(a =>
    (activeTag === '全部' || a.tags.includes(activeTag)) &&
    (!kw ||
      a.title.toLowerCase().includes(kw) ||
      a.tags.some(t => t.toLowerCase().includes(kw)))
  );

  gridEl.innerHTML = '';

  if (list.length === 0) {
    gridEl.innerHTML =
      '<div class="empty">没有找到相关番剧 🥲<br><span>换个关键词或分类试试</span></div>';
    return;
  }

  list.forEach((a, i) => {
    const card = document.createElement('article');
    card.className = 'card';
    card.dataset.id = a.id;
    card.style.setProperty('--c1', a.colors[0]);
    card.style.setProperty('--c2', a.colors[1]);
    card.style.transitionDelay = (i * 45) + 'ms';

    card.innerHTML =
      '<div class="cover">' +
        '<span class="emoji">' + a.emoji + '</span>' +
        '<span class="score">★ ' + a.rating + '</span>' +
      '</div>' +
      '<div class="info">' +
        '<h3>' + a.title + '</h3>' +
        '<p class="meta">' + a.year + ' · ' + a.tags.join(' / ') + '</p>' +
      '</div>';

    gridEl.appendChild(card);
    io.observe(card);

    // 动画结束后清掉延迟，避免影响 hover 响应
    setTimeout(() => { card.style.transitionDelay = ''; }, i * 45 + 700);
  });
}

/* ============ 打开详情弹窗 ============ */
function openModal(id) {
  const a = animeList.find(x => x.id === id);
  if (!a) return;

  const full = Math.round(a.rating / 2);
  const stars = '★'.repeat(full) + '☆'.repeat(5 - full);

  modalCard.innerHTML =
    '<button class="close" aria-label="关闭">✕</button>' +
    '<div class="m-hero" style="background:linear-gradient(145deg,' + a.colors[0] + ',' + a.colors[1] + ')">' + a.emoji + '</div>' +
    '<h2>' + a.title + '</h2>' +
    '<p class="m-meta">' + a.year + ' 年 · ' + a.tags.join(' / ') + '</p>' +
    '<div class="m-stars">' + stars + '<span>' + a.rating + '</span></div>' +
    '<p class="m-desc">' + a.desc + '</p>' +
    '<button class="btn btn-primary m-btn">加入追番清单</button>';

  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  modal.classList.remove('open');
  document.body.style.overflow = '';
}

/* ============ 事件绑定 ============ */
gridEl.addEventListener('click', (e) => {
  const card = e.target.closest('.card');
  if (card) openModal(Number(card.dataset.id));
});

modal.addEventListener('click', (e) => {
  if (e.target === modal || e.target.closest('.close')) closeModal();

  const btn = e.target.closest('.m-btn');
  if (btn) {
    btn.textContent = '✓ 已加入追番清单';
    btn.classList.add('done');
    btn.disabled = true;
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

searchEl.addEventListener('input', (e) => {
  keyword = e.target.value;
  render();
});

function randomAnime() {
  const a = animeList[Math.floor(Math.random() * animeList.length)];
  openModal(a.id);
}

document.getElementById('randomBtn').addEventListener('click', randomAnime);
document.getElementById('randomTop').addEventListener('click', (e) => {
  e.preventDefault();
  randomAnime();
});

/* ============ 启动 ============ */
render();
</script>
</body>
</html>
